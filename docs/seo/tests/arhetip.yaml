# Тест на архетип.
#
# Здесь другой режим подсчёта, чем в тестах на привязанность и темперамент:
# не пересечение двух шкал, а «побеждает сильнейшая» — каждое утверждение
# добавляет балл своему архетипу, результат определяется максимумом.
#
# Взяты шесть архетипов, которые чаще всего проявляются в женской практике.
# Полный юнгианский список длиннее, но шесть подробных разборов полезнее
# двенадцати поверхностных — об этом сказано в блоке вопросов на странице.

id: arhetip
mode: top
scaleMax: 9      # 3 утверждения на архетип по 3 балла максимум

resultHead: "Ваш ведущий архетип"

scaleLabels:
  hranitelnica: "Хранительница"
  voitelnica: "Воительница"
  tvorec: "Творец"
  iskatelnica: "Искательница"
  mudraya: "Мудрая"
  vozlyublennaya: "Возлюбленная"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: hranitelnica,   text: "Мне спокойнее, когда я знаю, что у близких всё в порядке" }
  - { scale: voitelnica,     text: "Если вижу несправедливость, мне трудно промолчать" }
  - { scale: tvorec,         text: "Внутри почти всегда зреет какая-нибудь задумка" }
  - { scale: iskatelnica,    text: "Мне быстро становится тесно там, где всё известно наперёд" }
  - { scale: mudraya,        text: "Прежде чем действовать, я хочу понять, как это устроено" }
  - { scale: vozlyublennaya, text: "Для меня важна красота вокруг: свет, ткани, запахи, детали" }

  - { scale: hranitelnica,   text: "Ко мне часто приходят за поддержкой, и мне это по силам" }
  - { scale: voitelnica,     text: "Мне легче действовать, чем ждать и наблюдать" }
  - { scale: tvorec,         text: "Я скорее сделаю по-своему, чем по проверенному образцу" }
  - { scale: iskatelnica,    text: "Смена обстановки возвращает мне силы лучше любого отдыха" }
  - { scale: mudraya,        text: "Мне интересно докапываться до сути, даже когда это не требуется" }
  - { scale: vozlyublennaya, text: "Я живу чувствами и не считаю это недостатком" }

  - { scale: hranitelnica,   text: "Я замечаю чужую усталость раньше, чем свою" }
  - { scale: voitelnica,     text: "Препятствие скорее раззадоривает меня, чем останавливает" }
  - { scale: tvorec,         text: "Мне важно оставить после себя что-то сделанное своими руками" }
  - { scale: iskatelnica,    text: "Я не боюсь начать заново, даже если придётся многое оставить" }
  - { scale: mudraya,        text: "Ко мне обращаются за советом, потому что я вижу картину целиком" }
  - { scale: vozlyublennaya, text: "Глубокая связь с человеком для меня важнее любых достижений" }

results:
  - { key: hranitelnica,   scale: hranitelnica,   title: "Хранительница" }
  - { key: voitelnica,     scale: voitelnica,     title: "Воительница" }
  - { key: tvorec,         scale: tvorec,         title: "Творец" }
  - { key: iskatelnica,    scale: iskatelnica,    title: "Искательница" }
  - { key: mudraya,        scale: mudraya,        title: "Мудрая" }
  - { key: vozlyublennaya, scale: vozlyublennaya, title: "Возлюбленная" }
