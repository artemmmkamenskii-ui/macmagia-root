# Тест на тип личности (16 типов).
#
# Режим axes: четыре бинарные оси, по каждой побеждает набравший больше полюс,
# результат — код из четырёх букв. Шкала утверждения указывается как
# <ось>_<полюс>, например ei_E: балл идёт полюсу «экстраверсия» оси ei.
#
# По 5 утверждений на ось (20 всего). Это короткая версия: в академических
# опросниках вопросов в разы больше, о чём честно сказано в блоке вопросов.

id: mbti
mode: axes

resultHead: "Ваш тип личности"

axes:
  - { key: ei, poles: [E, I], labels: ["Экстраверсия", "Интроверсия"] }
  - { key: sn, poles: [S, N], labels: ["Конкретика", "Интуиция"] }
  - { key: tf, poles: [T, F], labels: ["Логика", "Чувства"] }
  - { key: jp, poles: [J, P], labels: ["Планирование", "Гибкость"] }

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  # ось E / I
  - { scale: ei_E, text: "После дня в компании людей я чувствую подъём, а не опустошение" }
  - { scale: ei_I, text: "Мне нужно побыть одной, чтобы восстановиться" }
  - { scale: ei_E, text: "Я скорее думаю вслух, чем внутри себя" }
  - { scale: ei_I, text: "В большой компании я больше слушаю, чем говорю" }
  - { scale: ei_E, text: "Мне легко заговорить с незнакомым человеком" }

  # ось S / N
  - { scale: sn_S, text: "Я доверяю фактам и опыту больше, чем догадкам" }
  - { scale: sn_N, text: "Меня увлекают идеи и возможности, даже неприменимые прямо сейчас" }
  - { scale: sn_S, text: "Мне важны детали и точность в описании" }
  - { scale: sn_N, text: "Я часто улавливаю связи между вещами, которые другим кажутся несвязанными" }
  - { scale: sn_S, text: "Инструкция «делай по шагам» устраивает меня больше, чем «разберись сама»" }

  # ось T / F
  - { scale: tf_T, text: "Принимая решение, я взвешиваю аргументы, а не чувства" }
  - { scale: tf_F, text: "Мне важно, чтобы решение никого не ранило, даже если оно менее рационально" }
  - { scale: tf_T, text: "Справедливость для меня важнее, чем сглаживание конфликта" }
  - { scale: tf_F, text: "Я быстро считываю настроение людей вокруг" }
  - { scale: tf_T, text: "Критику по делу я воспринимаю спокойно, без обиды" }

  # ось J / P
  - { scale: jp_J, text: "Мне спокойнее, когда всё распланировано заранее" }
  - { scale: jp_P, text: "Я легко меняю планы на ходу и даже люблю это" }
  - { scale: jp_J, text: "Незакрытые дела висят у меня в голове и мешают" }
  - { scale: jp_P, text: "Дедлайн подстёгивает меня лучше, чем ранний старт" }
  - { scale: jp_J, text: "Я заранее собираю вещи и не откладываю на последний момент" }

results:
  - { key: istj, title: "ISTJ — Администратор" }
  - { key: isfj, title: "ISFJ — Защитник" }
  - { key: infj, title: "INFJ — Наставник" }
  - { key: intj, title: "INTJ — Стратег" }
  - { key: istp, title: "ISTP — Мастер" }
  - { key: isfp, title: "ISFP — Художник" }
  - { key: infp, title: "INFP — Идеалист" }
  - { key: intp, title: "INTP — Аналитик" }
  - { key: estp, title: "ESTP — Делец" }
  - { key: esfp, title: "ESFP — Артист" }
  - { key: enfp, title: "ENFP — Вдохновитель" }
  - { key: entp, title: "ENTP — Полемист" }
  - { key: estj, title: "ESTJ — Управленец" }
  - { key: esfj, title: "ESFJ — Хранитель" }
  - { key: enfj, title: "ENFJ — Вдохновляющий лидер" }
  - { key: entj, title: "ENTJ — Командир" }
