# Тест на самооценку.
#
# Две независимые шкалы, а не «высокая/низкая» одной линейкой — это
# принципиально. В психологии самооценки давно различают её УРОВЕНЬ и
# УСТОЙЧИВОСТЬ: бывает высокая, но целиком держащаяся на достижениях
# и чужом одобрении — она рушится от одной неудачи.
#
#   self     — устойчивое самоотношение: «я в порядке независимо от результата»
#   external — зависимость от внешней оценки: чужое мнение определяет самоощущение
#
# По 5 ПРЯМЫХ и 5 ОБРАТНЫХ на шкалу — поровну, чтобы согласный со всем
# подряд попадал ровно в середину. 10 × 3 → максимум 30, середина 15.

id: samoocenka
scaleMax: 30
threshold: 15

resultHead: "Ваш тип самооценки"

scaleLabels:
  self: "Внутренняя опора"
  external: "Зависимость от оценки"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: self,     text: "Я отношусь к себе доброжелательно, даже когда ошибаюсь" }
  - { scale: external, text: "Настроение сильно зависит от того, как обо мне отозвались" }
  - { scale: self,     text: "Я знаю свои сильные стороны и могу назвать их вслух" }
  - { scale: external, text: "Перед тем как что-то сделать, я думаю, что скажут другие" }
  - { scale: self,     reverse: true, text: "После неудачи я долго считаю себя никчёмной" }
  - { scale: external, reverse: true, text: "Чужое мнение обо мне я выслушиваю, но решаю сама" }
  - { scale: self,     text: "Я могу отказать, не чувствуя себя виноватой" }
  - { scale: external, text: "Похвала заметно поднимает мою уверенность, критика — обрушивает" }
  - { scale: self,     reverse: true, text: "Мне трудно принимать комплименты, я их обесцениваю" }
  - { scale: external, reverse: true, text: "Я спокойно отношусь к тому, что кому-то не нравлюсь" }
  - { scale: self,     reverse: true, text: "Мне кажется, хорошее отношение к себе нужно сначала заслужить" }
  - { scale: external, reverse: true, text: "Мне не нужно быть лучше других, чтобы чувствовать себя нормально" }
  - { scale: self,     reverse: true, text: "Я часто сравниваю себя с другими не в свою пользу" }
  - { scale: external, reverse: true, text: "Моя ценность для меня не зависит от достижений" }
  - { scale: self,     text: "Свои желания я считаю такими же важными, как чужие" }
  - { scale: external, text: "Если меня не одобрили, я долго это переживаю" }
  - { scale: self,     reverse: true, text: "Внутренний голос чаще ругает меня, чем поддерживает" }
  - { scale: external, reverse: true, text: "Я могу быть довольна собой, даже если этого никто не заметил" }
  - { scale: self,     text: "В новой ситуации я скорее верю, что справлюсь" }
  - { scale: external, text: "Я стараюсь быть удобной, чтобы ко мне хорошо относились" }

results:
  - { key: ustojchivaya, self: high, external: low,  title: "Устойчивая самооценка" }
  - { key: hrupkaya,     self: high, external: high, title: "Хрупкая уверенность" }
  - { key: tihaya,       self: low,  external: low,  title: "Тихая самокритика" }
  - { key: zavisimaya,   self: low,  external: high, title: "Зависимая самооценка" }
