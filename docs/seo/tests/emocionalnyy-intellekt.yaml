# Тест на эмоциональный интеллект.
#
# Четыре составляющие по модели Дэниела Гоулмана. Режим top: результат —
# самая сильная составляющая, но в блоке результата показываются ВСЕ четыре
# (showScales: 4), потому что здесь важнее профиль целиком, а не победитель.
#
# Обратных утверждений тут нет намеренно: в режиме top склонность соглашаться
# со всем подряд поднимает все четыре шкалы одинаково и почти не влияет на то,
# какая окажется ведущей. Порога, через который можно перебросить, тоже нет.

id: emocionalnyy-intellekt
mode: top
scaleMax: 15      # 5 утверждений на шкалу по 3 балла
showScales: 4

resultHead: "Ваша сильная сторона"

scaleLabels:
  samoosoznanie: "Понимание своих эмоций"
  samoregulyaciya: "Управление собой"
  empatiya: "Эмпатия"
  navyki: "Социальные навыки"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: samoosoznanie,   text: "Я могу довольно точно назвать, что именно сейчас чувствую" }
  - { scale: samoregulyaciya, text: "В раздражении я успеваю остановиться до того, как сказала лишнее" }
  - { scale: empatiya,        text: "Я замечаю по мелочам, что человеку плохо, даже если он это скрывает" }
  - { scale: navyki,          text: "Мне удаётся договариваться там, где другие ссорятся" }

  - { scale: samoosoznanie,   text: "Я понимаю, что именно вызвало мою реакцию, а не только что мне плохо" }
  - { scale: samoregulyaciya, text: "Сильные эмоции не мешают мне делать то, что нужно" }
  - { scale: empatiya,        text: "Мне легко представить ситуацию с точки зрения другого человека" }
  - { scale: navyki,          text: "В новой компании я быстро нахожу общий язык" }

  - { scale: samoosoznanie,   text: "Я различаю близкие состояния: усталость, обиду, тревогу" }
  - { scale: samoregulyaciya, text: "Я умею успокоиться сама, не требуя этого от других" }
  - { scale: empatiya,        text: "Чужие переживания я воспринимаю всерьёз, даже если сама бы так не реагировала" }
  - { scale: navyki,          text: "Я умею сказать неприятное так, чтобы человек услышал, а не закрылся" }

  - { scale: samoosoznanie,   text: "Я замечаю телесные сигналы своих эмоций: напряжение, ком в горле, тяжесть" }
  - { scale: samoregulyaciya, text: "После неприятного разговора я довольно быстро возвращаюсь в рабочее состояние" }
  - { scale: empatiya,        text: "Я чувствую настроение группы людей, когда вхожу в помещение" }
  - { scale: navyki,          text: "Ко мне обращаются, когда нужно уладить конфликт" }

  - { scale: samoosoznanie,   text: "Я понимаю, какие ситуации выбивают меня из колеи, и почему именно эти" }
  - { scale: samoregulyaciya, text: "Я могу выдержать чужое недовольство, не разрушаясь и не нападая" }
  - { scale: empatiya,        text: "Мне важно понять мотив человека, прежде чем оценивать поступок" }
  - { scale: navyki,          text: "Я умею поддержать так, чтобы человеку стало легче, а не тяжелее" }

results:
  - { key: samoosoznanie,   scale: samoosoznanie,   title: "Понимание своих эмоций" }
  - { key: samoregulyaciya, scale: samoregulyaciya, title: "Управление собой" }
  - { key: empatiya,        scale: empatiya,        title: "Эмпатия" }
  - { key: navyki,          scale: navyki,          title: "Социальные навыки" }
