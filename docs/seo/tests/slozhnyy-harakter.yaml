# Тест на сложный характер.
#
# Режим top: каждое утверждение добавляет балл одной из шести черт, которые
# в стрессе выходят вперёд и осложняют отношения. Ведущей становится
# набравшая больше всего.
#
# Важно про формулировки: это не диагностика расстройств и не ярлыки. Речь
# о защитных стратегиях — том, как человек в напряжении привычно себя ведёт.
# Поэтому в разборах у каждой черты обязательно есть и сильная сторона.

id: slozhnyy-harakter
mode: top
scaleMax: 9      # 3 утверждения на черту по 3 балла

resultHead: "Что усложняет вам жизнь с людьми"

scaleLabels:
  trebovatelnost: "Сверхтребовательность"
  obidchivost: "Обидчивость"
  kontrol: "Контроль"
  ugodlivost: "Угодливость"
  vspylchivost: "Вспыльчивость"
  zakrytost: "Закрытость"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: trebovatelnost, text: "Меня раздражает, когда люди делают работу небрежно" }
  - { scale: obidchivost,    text: "Я долго помню сказанное вскользь, если оно меня задело" }
  - { scale: kontrol,        text: "Мне спокойнее, когда я сама всё проверю" }
  - { scale: ugodlivost,     text: "Мне трудно отказать, даже когда совсем не хочется соглашаться" }
  - { scale: vspylchivost,   text: "В раздражении я могу сказать резкость, о которой потом жалею" }
  - { scale: zakrytost,      text: "О своих трудностях я рассказываю в последнюю очередь" }

  - { scale: trebovatelnost, text: "Я замечаю чужие ошибки быстрее, чем удачные решения" }
  - { scale: obidchivost,    text: "Если меня не позвали или забыли, я делаю выводы об отношении ко мне" }
  - { scale: kontrol,        text: "Когда что-то идёт не по плану, я плохо переношу неопределённость" }
  - { scale: ugodlivost,     text: "Я подстраиваюсь под настроение других, даже в ущерб себе" }
  - { scale: vspylchivost,   text: "Мне трудно остановиться в споре, пока я не докажу свою правоту" }
  - { scale: zakrytost,      text: "Просить о помощи для меня некомфортнее, чем справиться самой" }

  - { scale: trebovatelnost, text: "К себе я отношусь строже, чем к кому бы то ни было" }
  - { scale: obidchivost,    text: "Я могу отдалиться от человека, не объяснив причины" }
  - { scale: kontrol,        text: "Мне сложно делегировать: проще сделать самой, чем объяснять" }
  - { scale: ugodlivost,     text: "Я часто соглашаюсь вслух, а внутри злюсь" }
  - { scale: vspylchivost,   text: "Реакция обычно опережает у меня размышление" }
  - { scale: zakrytost,      text: "Даже близкие не всегда понимают, что со мной происходит" }

results:
  - { key: trebovatelnost, scale: trebovatelnost, title: "Сверхтребовательность" }
  - { key: obidchivost,    scale: obidchivost,    title: "Обидчивость" }
  - { key: kontrol,        scale: kontrol,        title: "Контроль" }
  - { key: ugodlivost,     scale: ugodlivost,     title: "Угодливость" }
  - { key: vspylchivost,   scale: vspylchivost,   title: "Вспыльчивость" }
  - { key: zakrytost,      scale: zakrytost,      title: "Закрытость" }
