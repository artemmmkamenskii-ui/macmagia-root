# Тест на ревность.
#
# Две независимые шкалы — принципиально, потому что ревность бывает очень
# разной по механизму:
#
#   strah   — страх потери: сравнение себя с другими, ощущение недостаточности,
#             мысли «меня заменят»
#   kontrol — поведение: проверки, вопросы, требования отчёта, ограничения
#
# Одно без другого встречается сплошь и рядом: можно мучиться внутри и ничего
# не предпринимать, а можно контролировать «по принципу», почти не тревожась.
#
# По 5 ПРЯМЫХ и 5 ОБРАТНЫХ на шкалу — поровну. 10 × 3 → максимум 30, середина 15.

id: revnost
scaleMax: 30
threshold: 15

resultHead: "Как устроена ваша ревность"

scaleLabels:
  strah: "Страх потери"
  kontrol: "Контроль"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: strah,   text: "Я сравниваю себя с теми, кто нравится моему партнёру" }
  - { scale: kontrol, text: "Мне хочется знать, где и с кем он находится" }
  - { scale: strah,   text: "Мысль, что меня могут заменить кем-то лучше, приходит регулярно" }
  - { scale: kontrol, text: "Я задаю уточняющие вопросы о его встречах и переписке" }
  - { scale: strah,   reverse: true, text: "Я спокойна, когда партнёр общается с привлекательными людьми" }
  - { scale: kontrol, reverse: true, text: "Мне не приходит в голову проверять его телефон" }
  - { scale: strah,   text: "Если он хвалит другую женщину, мне становится неприятно" }
  - { scale: kontrol, text: "Я замечаю за собой желание ограничить круг его общения" }
  - { scale: strah,   reverse: true, text: "Я уверена, что интересна партнёру сама по себе" }
  - { scale: kontrol, reverse: true, text: "Я считаю нормальным, что у партнёра есть своя жизнь без меня" }
  - { scale: strah,   reverse: true, text: "Я не додумываю, что происходит, когда партнёра нет рядом" }
  - { scale: kontrol, reverse: true, text: "Я спокойно жду ответа на сообщение сколько потребуется" }
  - { scale: strah,   reverse: true, text: "Его прошлые отношения меня не задевают" }
  - { scale: kontrol, reverse: true, text: "Я легко отпускаю партнёра на встречи, о которых мало знаю" }
  - { scale: strah,   text: "Мне кажется, что я вкладываюсь в отношения больше и потому уязвимее" }
  - { scale: kontrol, text: "Я прошу подтверждений и обещаний чаще, чем хотелось бы" }
  - { scale: strah,   reverse: true, text: "Я редко думаю о том, что отношения могут закончиться" }
  - { scale: kontrol, reverse: true, text: "Мне не нужно знать подробности его дня, чтобы быть спокойной" }
  - { scale: strah,   text: "Чужое внимание к партнёру я воспринимаю как угрозу" }
  - { scale: kontrol, text: "Я обижаюсь, если он не рассказал о встрече заранее" }

results:
  - { key: doverie,    strah: low,  kontrol: low,  title: "Спокойное доверие" }
  - { key: vnutrennyaya, strah: high, kontrol: low, title: "Ревность внутрь" }
  - { key: kontroliruyushchaya, strah: low, kontrol: high, title: "Ревность как контроль" }
  - { key: zahvatyvayushchaya, strah: high, kontrol: high, title: "Захватывающая ревность" }
