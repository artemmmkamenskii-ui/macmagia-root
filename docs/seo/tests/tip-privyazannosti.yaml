# Тест на тип привязанности.
#
# Логика — две независимые шкалы, как в опроснике ECR (Experiences in Close
# Relationships): тревожность (страх отвержения) и избегание (дискомфорт от
# близости). Пересечение даёт четыре типа. Это честнее, чем «выбери один ответ
# из четырёх»: человек не выбирает свой тип сам, тип получается из профиля.
#
# Каждое утверждение оценивается по шкале 0–3. Максимум по шкале — 24.
# Порог 12: выше — шкала считается выраженной.

id: tip-privyazannosti
scaleMax: 24
threshold: 12

resultHead: "Ваш тип привязанности"

scaleLabels:
  anxiety: "Тревожность"
  avoidance: "Избегание"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: anxiety,   text: "Я часто боюсь, что близкий человек перестанет меня любить" }
  - { scale: avoidance, text: "Мне проще справиться с трудным самой, чем попросить о поддержке" }
  - { scale: anxiety,   text: "Если близкий долго не отвечает, я начинаю думать, что что-то не так" }
  - { scale: avoidance, text: "Когда становится слишком близко, мне хочется отстраниться" }
  - { scale: anxiety,   text: "Мне нужно, чтобы меня время от времени уверяли в чувствах — иначе я начинаю сомневаться" }
  - { scale: avoidance, text: "Мне некомфортно говорить о своих переживаниях даже с близкими" }
  - { scale: anxiety,   text: "Я расстраиваюсь, когда близкий человек проводит время без меня" }
  - { scale: avoidance, text: "Я дорожу своей самостоятельностью и не люблю, когда от меня многого ждут" }
  - { scale: anxiety,   text: "Мне трудно оставаться спокойной, пока в отношениях нет ясности" }
  - { scale: avoidance, text: "Мне легче обсуждать дела, чем то, что я чувствую" }
  - { scale: anxiety,   text: "Я ловлю себя на том, что перечитываю сообщения и ищу в них скрытый смысл" }
  - { scale: avoidance, text: "Когда другой человек хочет больше близости, я чувствую давление" }
  - { scale: anxiety,   text: "После ссоры мне очень тяжело, пока всё не прояснится" }
  - { scale: avoidance, text: "Я редко показываю, что мне плохо" }
  - { scale: anxiety,   text: "Мне кажется, что я вкладываюсь в отношения больше, чем другой человек" }
  - { scale: avoidance, text: "Мне важно иметь своё пространство, куда никто не заходит" }

# Порядок важен: JS ищет по этим ключам якоря результатов в тексте статьи
results:
  - { key: nadezhnyy,  anxiety: low,  avoidance: low,  title: "Надёжный тип" }
  - { key: trevozhnyy, anxiety: high, avoidance: low,  title: "Тревожный тип" }
  - { key: izbegayushchiy, anxiety: low, avoidance: high, title: "Избегающий тип" }
  - { key: dezorganizovannyy, anxiety: high, avoidance: high, title: "Тревожно-избегающий тип" }
