# Тест на созависимость.
#
# Запрос звучит как «тест на созависимость», но проверять тут нечего и некого:
# созависимость — не состояние, которое либо есть, либо нет, а способ жить
# рядом с другим человеком, где своё постепенно отдаётся. Поэтому тест не
# ставит метку, а показывает, в какой форме это у вас зашло дальше всего.
#
# ПОЧЕМУ РЕЖИМ TOP, А НЕ ПОРОГ. Порог здесь означал бы вердикт: «набрала мало —
# значит, показалось, всё нормально». Женщина, которая годами держит на себе
# чужую жизнь, слышит эту фразу и от близких, и от себя самой, и повторять её
# тестом нельзя. У режима top порога нет: он не делит на «есть/нет», а говорит,
# что из описанного громче остального. showScales: 4 выводит все четыре шкалы
# с баллами — интенсивность читается по цифрам, а не по приговору.
# Второй довод тот же, что и в тесте на абьюзера: четыре шкалы через порог
# дали бы шестнадцать сочетаний, и сведение их к четырём разборам вышло бы
# произвольным.
#
# КЛИНИЧЕСКИЕ ШКАЛЫ НЕ ВОСПРОИЗВОДИМ. Профессиональные опросники созависимости
# существуют, но это рабочий инструмент специалиста: они написаны под того,
# кто потом читает результат вместе с человеком. В интернете, без этого
# второго участника, они дают только лишнюю тревогу и ощущение диагноза.
# Утверждения ниже написаны с нуля и под другую задачу — назвать происходящее.
#
# ЧЕТЫРЕ ШКАЛЫ — четыре формы, в которых созависимость обычно и проявляется:
#   spasatelstvo — спасательство: я делаю за него и улаживаю последствия
#   kontrol      — контроль: я держу его состояние под наблюдением
#   rastvorenie  — потеря себя: своих дел, желаний и тем для разговора не осталось
#   vina         — вина и страх: отойти в сторону нельзя, думать о себе стыдно
#
# ФОРМУЛИРОВКИ. Только мои собственные действия и мои переживания. Никаких
# оценок близкому («он зависимый», «он манипулирует») — во-первых, это диагноз
# по интернету, во-вторых, созависимый человек первым делом оправдывает
# близкого и такую формулировку просто не выберет. А вспомнить, звонила ли она
# на работу, чтобы его прикрыть, — может.
#
# НЕЙТРАЛЬНОСТЬ ПО СФЕРЕ. Запросы приходят про партнёра, про мать, про взрослого
# ребёнка и про подругу, поэтому в утверждениях нет ни «муж», ни «алкоголь»:
# человек отвечает про одного конкретного близкого, которого выбрал сам.
#
# ВАРИАНТЫ ОТВЕТА — про то, как бывает обычно, а не про худший день: речь об
# устойчивом укладе, а не о реакции на одну кризисную неделю.
#
# Обратных утверждений нет намеренно: в режиме top склонность соглашаться
# поднимает все четыре шкалы одинаково и почти не влияет на ведущую.

id: sozavisimost
mode: top
scaleMax: 15      # 5 утверждений на шкалу по 3 балла
showScales: 4

resultHead: "Что в этой связи звучит громче всего"

scaleLabels:
  spasatelstvo: "Спасательство"
  kontrol: "Контроль"
  rastvorenie: "Потеря себя"
  vina: "Вина и страх"

options:
  - { label: "Нет, это не про меня", value: 0 }
  - { label: "Иногда бывает", value: 1 }
  - { label: "Да, часто", value: 2 }
  - { label: "Да, почти всегда", value: 3 }

questions:
  - { scale: spasatelstvo, text: "Я делаю за него то, с чем он мог бы справиться сам" }
  - { scale: kontrol,      text: "По мелочам я определяю, в каком он состоянии, ещё до того, как он заговорит" }
  - { scale: rastvorenie,  text: "Моё настроение на весь день зависит от того, какое настроение у него" }
  - { scale: vina,         text: "От мысли отойти в сторону и заняться своей жизнью я чувствую вину" }

  - { scale: spasatelstvo, text: "Я разбираюсь с последствиями его решений: договариваюсь, объясняю, улаживаю" }
  - { scale: kontrol,      text: "Я строю вечер так, чтобы у него не испортилось настроение" }
  - { scale: rastvorenie,  text: "На вопрос, чего мне самой сейчас хочется, я не могу ответить сразу" }
  - { scale: vina,         text: "Я скрываю от родных и знакомых, что у нас происходит на самом деле" }

  - { scale: spasatelstvo, text: "Я начинаю помогать раньше, чем меня об этом просят" }
  - { scale: kontrol,      text: "Я проверяю то, что он не предлагал мне проверять: переписку, траты, сумку, шкаф" }
  - { scale: rastvorenie,  text: "Я отказалась от своих занятий, встреч или поездок из-за ситуации с ним" }
  - { scale: vina,         text: "Мне кажется, что без меня он не справится и станет только хуже" }

  - { scale: spasatelstvo, text: "Я искала за него выход: специалистов, работу, деньги, варианты решения" }
  - { scale: kontrol,      text: "Мне кажется, что стоит мне ослабить внимание — и всё развалится" }
  - { scale: rastvorenie,  text: "В разговорах с другими людьми я рассказываю про него больше, чем про себя" }
  - { scale: vina,         text: "Я остаюсь в этих отношениях, хотя мне в них плохо" }

  - { scale: spasatelstvo, text: "Я отдаю на его дела время, деньги или силы, которых мне самой не хватает" }
  - { scale: kontrol,      text: "Я много раз объясняю и уговариваю, надеясь, что на этот раз он услышит" }
  - { scale: rastvorenie,  text: "Я не помню, когда последний раз делала что-то только для себя" }
  - { scale: vina,         text: "Когда я думаю о своих планах, мне становится стыдно перед ним" }

results:
  - { key: spasatelstvo, scale: spasatelstvo, title: "Вы живёте его делами" }
  - { key: kontrol,      scale: kontrol,      title: "Вы держите всё на себе" }
  - { key: rastvorenie,  scale: rastvorenie,  title: "Своего почти не осталось" }
  - { key: vina,         scale: vina,         title: "Отойти нельзя, думать о себе стыдно" }
