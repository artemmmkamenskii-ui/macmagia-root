# Тест на тип темперамента.
#
# Логика — «круг Айзенка»: две независимые шкалы, экстраверсия и нейротизм
# (эмоциональная неустойчивость). Их пересечение и даёт четыре классических
# темперамента, описанных ещё Гиппократом:
#
#                      нейротизм высокий
#          МЕЛАНХОЛИК   |   ХОЛЕРИК
#   интроверсия ────────┼──────── экстраверсия
#          ФЛЕГМАТИК    |   САНГВИНИК
#                      нейротизм низкий
#
# Каждое утверждение оценивается по шкале 0–3. Максимум по шкале — 24,
# порог 12: выше — шкала считается выраженной.

id: tip-temperamenta
scaleMax: 24
threshold: 12

resultHead: "Ваш тип темперамента"

scaleLabels:
  extraversion: "Экстраверсия"
  neuroticism: "Эмоциональная чувствительность"

options:
  - { label: "Совсем не про меня", value: 0 }
  - { label: "Скорее не про меня", value: 1 }
  - { label: "Скорее про меня", value: 2 }
  - { label: "Точно про меня", value: 3 }

questions:
  - { scale: extraversion, text: "В компании незнакомых людей я легко заговариваю первой" }
  - { scale: neuroticism,  text: "Мелкая неудача может испортить мне весь день" }
  - { scale: extraversion, text: "После шумной встречи я чувствую прилив сил, а не опустошение" }
  - { scale: neuroticism,  text: "Я подолгу прокручиваю в голове разговоры, которые уже закончились" }
  - { scale: extraversion, text: "Мне легче думать вслух и обсуждать, чем размышлять в одиночку" }
  - { scale: neuroticism,  text: "Настроение может смениться у меня за несколько минут" }
  - { scale: extraversion, text: "Я быстро принимаю решения и не люблю долго взвешивать" }
  - { scale: neuroticism,  text: "Я часто волнуюсь о том, что ещё не случилось" }
  - { scale: extraversion, text: "Мне скучно, когда в жизни ничего не происходит" }
  - { scale: neuroticism,  text: "Критика задевает меня сильнее, чем показываю" }
  - { scale: extraversion, text: "Я охотно берусь за новое, даже не зная всех деталей" }
  - { scale: neuroticism,  text: "Перед важным событием мне трудно уснуть" }
  - { scale: extraversion, text: "Друзья считают меня человеком, который заводит компанию" }
  - { scale: neuroticism,  text: "Я замечаю у себя телесную реакцию на переживания: ком в горле, тяжесть, дрожь" }
  - { scale: extraversion, text: "Долгое время наедине с собой быстро начинает тяготить" }
  - { scale: neuroticism,  text: "Мне трудно отпустить ситуацию, пока я не разберу её до конца" }

results:
  - { key: sangvinik,  extraversion: high, neuroticism: low,  title: "Сангвиник" }
  - { key: holerik,    extraversion: high, neuroticism: high, title: "Холерик" }
  - { key: flegmatik,  extraversion: low,  neuroticism: low,  title: "Флегматик" }
  - { key: melanholik, extraversion: low,  neuroticism: high, title: "Меланхолик" }
