# Тест на отношения.
#
# Особенность: шкалы здесь — не достоинства, а ПРОБЛЕМНЫЕ ЗОНЫ. Чем выше балл,
# тем сильнее просадка в этой области. Режим top выбирает максимум, то есть
# самое слабое место пары. Так честнее: сильные стороны человек и сам знает,
# а польза теста — в том, чтобы назвать то, что расшатывает.
#
# Пять зон, по 4 утверждения на каждую. showScales: 5 — показываем весь профиль,
# потому что важно видеть не только слабое место, но и что в порядке.
#
# Обратных утверждений нет намеренно: в режиме top смещение согласия поднимает
# все шкалы одинаково и почти не влияет на то, какая окажется ведущей.

id: otnosheniya
mode: top
scaleMax: 12      # 4 утверждения на шкалу по 3 балла
showScales: 5

resultHead: "Ваша зона роста"

scaleLabels:
  doverie: "Доверие"
  blizost: "Эмоциональная близость"
  avtonomiya: "Личное пространство"
  konflikty: "Умение ссориться"
  budushchee: "Общее будущее"

options:
  - { label: "Совсем не про нас", value: 0 }
  - { label: "Скорее не про нас", value: 1 }
  - { label: "Скорее про нас", value: 2 }
  - { label: "Точно про нас", value: 3 }

questions:
  - { scale: doverie,    text: "Я не всегда уверена, что мне рассказывают всё как есть" }
  - { scale: blizost,    text: "Мы редко говорим о том, что каждый из нас на самом деле чувствует" }
  - { scale: avtonomiya, text: "У меня мало времени и пространства, которые принадлежат только мне" }
  - { scale: konflikty,  text: "Наши ссоры уходят в сторону от темы и превращаются во взаимные упрёки" }
  - { scale: budushchee, text: "Мы по-разному представляем, как хотим жить через несколько лет" }

  - { scale: doverie,    text: "Мне важно проверять то, что мне говорят" }
  - { scale: blizost,    text: "Мы больше решаем бытовые вопросы, чем разговариваем" }
  - { scale: avtonomiya, text: "Мои отдельные интересы воспринимаются как отдаление" }
  - { scale: konflikty,  text: "После ссоры мы долго не разговариваем и делаем вид, что ничего не было" }
  - { scale: budushchee, text: "Важные решения о будущем мы откладываем, потому что боимся спорить" }

  - { scale: doverie,    text: "У нас есть темы, которые лучше не поднимать" }
  - { scale: blizost,    text: "Я чувствую себя одинокой, даже когда мы рядом" }
  - { scale: avtonomiya, text: "Мне неловко просить время побыть одной" }
  - { scale: konflikty,  text: "В споре кто-то из нас замолкает и уходит вместо разговора" }
  - { scale: budushchee, text: "Мне непонятно, чего партнёр на самом деле хочет от наших отношений" }

  - { scale: doverie,    text: "Я не рассказываю о некоторых вещах, чтобы избежать реакции" }
  - { scale: blizost,    text: "Нежность и тепло между нами стали редкостью" }
  - { scale: avtonomiya, text: "Мы почти всё делаем вместе, и мне иногда тесно" }
  - { scale: konflikty,  text: "Одни и те же конфликты повторяются годами без изменений" }
  - { scale: budushchee, text: "Мы избегаем разговоров о том, что будет дальше" }

results:
  - { key: doverie,    scale: doverie,    title: "Доверие" }
  - { key: blizost,    scale: blizost,    title: "Эмоциональная близость" }
  - { key: avtonomiya, scale: avtonomiya, title: "Личное пространство" }
  - { key: konflikty,  scale: konflikty,  title: "Умение ссориться" }
  - { key: budushchee, scale: budushchee, title: "Общее будущее" }
