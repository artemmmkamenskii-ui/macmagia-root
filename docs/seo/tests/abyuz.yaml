# Тест на абьюзера.
#
# Запрос называется «тест на абьюзера», но сам тест — не про человека и не про
# ярлык для него. Он про то, что происходит в отношениях и с самой женщиной.
# Главная трудность абьюза в том, что происходящее не названо словами и потому
# выглядит нормой: каждый эпизод по отдельности объясним усталостью, ревностью
# или характером. Задача теста — вернуть словам имена, а не вынести приговор.
#
# ПОЧЕМУ РЕЖИМ TOP, А НЕ ПОРОГ. Порог здесь означал бы вердикт: «набрала мало —
# значит, не абьюз, показалось». Это ровно та фраза, которую женщина в таких
# отношениях слышит годами и снаружи, и внутри себя, и повторять её тестом
# нельзя. У режима top порога нет: он не делит на «есть/нет», а показывает,
# что из описанного звучит громче остального. showScales: 4 выводит все четыре
# шкалы с баллами — интенсивность видна по цифрам рядом, а не по вердикту.
# Второй довод: четыре шкалы через порог дали бы шестнадцать сочетаний, и любое
# сведение их к четырём результатам получилось бы произвольным.
#
# ЧЕТЫРЕ ШКАЛЫ — четыре формы, в которых абьюз обычно и проявляется:
#   kontrol       — контроль: отчёты, проверки, доступ к деньгам и решениям
#   obescenivanie — обесценивание: «ты придумала», «без меня не справишься»
#   izolyaciya    — изоляция: круг общения постепенно сужается до одного человека
#   strah         — напряжение и страх: хождение по минному полю
#
# ФОРМУЛИРОВКИ. Только наблюдаемое поведение и её собственное переживание.
# Никаких оценок вроде «мой партнёр жестокий»: оценку женщина в абьюзе как раз
# и не может себе позволить — она первым делом оправдывает партнёра. А вот
# вспомнить, продумывает ли она заранее, как сказать, чтобы он не вспылил, —
# может, и это тот же факт, только доступный изнутри.
#
# ВАРИАНТЫ ОТВЕТА — частота, а не согласие. Абьюз отличается от плохого дня
# именно системой, поэтому «регулярно» тут информативнее, чем «скорее про нас».
#
# Обратных утверждений нет намеренно: в режиме top смещение согласия поднимает
# все четыре шкалы одинаково и почти не влияет на то, какая окажется ведущей.

id: abyuz
mode: top
scaleMax: 15      # 5 утверждений на шкалу по 3 балла
showScales: 4

resultHead: "Что в этих отношениях заметнее всего"

scaleLabels:
  kontrol: "Контроль"
  obescenivanie: "Обесценивание"
  izolyaciya: "Изоляция"
  strah: "Напряжение и страх"

options:
  - { label: "Никогда", value: 0 }
  - { label: "Было пару раз", value: 1 }
  - { label: "Случается регулярно", value: 2 }
  - { label: "Так почти всегда", value: 3 }

questions:
  - { scale: kontrol,       text: "Мне приходится отчитываться, где я была и с кем, даже по мелочам" }
  - { scale: obescenivanie, text: "В ответ на мои чувства я слышу, что я всё придумала или преувеличиваю" }
  - { scale: izolyaciya,    text: "Встречу с подругой мне нужно объяснить и обосновать" }
  - { scale: strah,         text: "Я заранее продумываю, как сказать, чтобы он не вспылил" }

  - { scale: kontrol,       text: "Он смотрит мой телефон, переписки или геолокацию" }
  - { scale: obescenivanie, text: "Моя работа и то, что мне удаётся, подаются как что-то незначительное" }
  - { scale: izolyaciya,    text: "После моего общения с роднёй дома почти всегда напряжение или ссора" }
  - { scale: strah,         text: "По тому, как открывается дверь, я понимаю, каким будет вечер" }

  - { scale: kontrol,       text: "Мои траты обсуждаются и требуют одобрения, а его — нет" }
  - { scale: obescenivanie, text: "Он подшучивает надо мной при других, а на мою реакцию отвечает, что я не понимаю юмора" }
  - { scale: izolyaciya,    text: "Я стала заметно реже видеться с людьми, которые были мне близки" }
  - { scale: strah,         text: "Я молчу о том, что меня задело, потому что дороже выйдет" }

  - { scale: kontrol,       text: "Я согласовываю с ним свою одежду, внешний вид или планы на вечер" }
  - { scale: obescenivanie, text: "После разговора с ним я чувствую себя глупой и неправой" }
  - { scale: izolyaciya,    text: "Он объясняет мне, чем именно мои друзья и родные мне вредят" }
  - { scale: strah,         text: "Я извиняюсь первой, даже когда не понимаю, в чём виновата" }

  - { scale: kontrol,       text: "Общие решения в итоге принимает он, даже если я была против" }
  - { scale: obescenivanie, text: "Я слышу, что без него я не справлюсь" }
  - { scale: izolyaciya,    text: "Мне не с кем поговорить о том, что происходит у нас дома" }
  - { scale: strah,         text: "Мне бывает физически страшно рядом с ним — от тона, взгляда, того, как он подходит близко" }

results:
  - { key: kontrol,       scale: kontrol,       title: "В этих отношениях много контроля" }
  - { key: obescenivanie, scale: obescenivanie, title: "В этих отношениях вас обесценивают" }
  - { key: izolyaciya,    scale: izolyaciya,    title: "Вы остались без своего круга" }
  - { key: strah,         scale: strah,         title: "Вы живёте в постоянном напряжении" }
