name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Ежедневная автопубликация: пересобирает блог и выкатывает статьи,
    # у которых publishedAt уже наступил (по 10 в день через отложенные даты).
    # 06:10 UTC = 09:10 МСК.
    - cron: "10 6 * * *"

concurrency:
  group: production-deploy-root
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          if [ -n "$DEPLOY_SSH_KEY_B64" ]; then
            echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          elif [ -n "$DEPLOY_SSH_KEY" ]; then
            printf "%s" "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "No SSH key secret configured (DEPLOY_SSH_KEY or DEPLOY_SSH_KEY_B64)." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install build deps
        run: pip install -r scripts/requirements.txt

      - name: Build blog from markdown
        run: python3 scripts/build_blog.py

      - name: Upload static landing to webroot
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude "deploy" \
            --exclude "README.md" \
            --exclude "docs" \
            --exclude "scripts" \
            --exclude "*.psd" \
            --exclude "*.fig" \
            --exclude "ChatGPT*.png" \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/macmagia-root/"

      - name: Remove nginx root→/cards redirect (optional)
        continue-on-error: true
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'if [ -f "$HOME/macmagia/deploy/remove-nginx-root-redirect.sh" ]; then bash "$HOME/macmagia/deploy/remove-nginx-root-redirect.sh" || echo "nginx fix failed — see macmagia-root/deploy/setup-server.sh"; else echo "remove-nginx-root-redirect.sh not found (run setup-server.sh once)"; fi'

      - name: Post fresh articles to VK
        # Только по расписанию: деплой запускается и на каждый push,
        # иначе одна и та же статья улетела бы в группу несколько раз за день.
        # ОТКЛЮЧЕНО по решению 2026-07-27: VK-статьи через API не создаются,
        # а полные дубли текста на трастовом vk.com конкурируют с молодым сайтом.
        # Чтобы вернуть — заменить false на github.event_name == 'schedule'.
        if: false
        continue-on-error: true
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          printf 'VK_TOKEN=%s\nVK_GROUP_ID=%s\nVK_API_VERSION=5.199\n' \
            "$VK_TOKEN" "$VK_GROUP_ID" > .env
          pip install requests
          python3 scripts/post_vk.py --limit 10
          rm -f .env

      - name: Health check
        run: |
          fail=0
          for url in https://macmagia.ru/ https://macmagia.ru/blog/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            echo "$url → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ] || exit 1
